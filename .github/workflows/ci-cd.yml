  aws-auth:
    name: Inspect AWS OIDC Claims
    needs: docker-build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Inspect OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)

          # Add padding for base64 decoding
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ "$MOD" -ne 0 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $((4-MOD))))"
          fi

          echo "$PAYLOAD" | base64 -d | python -m json.tool